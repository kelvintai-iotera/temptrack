# MQTT Config
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

listener 1883
protocol mqtt
# Gateways on the LAN often have no MQTT username/password configured.
# allow_anonymous true lets them publish; the app still connects with MQTT_USER/MQTT_PASSWORD.
allow_anonymous true
password_file /mosquitto/config/passwd

sys_interval 10
