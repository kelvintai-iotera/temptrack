<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var key = 'temptrack-theme';
        var allowed = { light: 1, dark: 1, system: 1 };
        var pref = localStorage.getItem(key);
        if (!allowed[pref]) pref = 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var resolved = pref === 'light'
          ? 'light'
          : (pref === 'dark' || dark)
            ? 'dark'
            : 'light';
        var root = document.documentElement;
        root.classList.remove('light', 'dark');
        if (pref === 'light') root.classList.add('light');
        else if (pref === 'dark' || dark) root.classList.add('dark');
        root.style.colorScheme = resolved;
      })();
    </script>
    <title>TempTrack Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
